name: mobile-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Empaquetar client (userscript + bundles Android)
        run: node tools/build-mobile.js

      - name: Actualizar userscript en el repo (dist/)
        run: |
          git config user.name "minifeather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/MiniFeatherClient.user.js
          git diff --cached --quiet || git commit -m "build: regenerar userscript móvil [skip ci]"
          git push

      - name: Compilar APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug -p android

      - name: Publicar release móvil (tag apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          NAME="MiniFeather-Client-$VERSION-android.apk"
          cp "$APK" "$NAME"
          gh release create apk-latest "$NAME#MiniFeather Client $VERSION (Android)" \
            --title "MiniFeather Client — build móvil" \
            --notes "APK Android (debug, firmado con clave de debug) y userscript en dist/MiniFeatherClient.user.js. Regenerado automáticamente en cada push a main." \
            --clobber \
          || gh release upload apk-latest "$NAME" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
