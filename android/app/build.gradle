plugins {
    id 'com.android.application'
}

def clientManifest = new groovy.json.JsonSlurper().parseText(file('../../manifest.json').text)

android {
    namespace 'com.devofficial.minifeather'
    compileSdk 34

    defaultConfig {
        applicationId "com.devofficial.minifeather"
        minSdk 24
        targetSdk 34
        versionCode System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1
        versionName clientManifest.version
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// the apk carries the whole client (modules, assets, models, classic) under assets/client/
android.sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir('generated/clientAssets')]

tasks.register('syncClientAssets', Copy) {
    description 'copies the client files into the apk'
    from(rootDir.parentFile) {
        include 'src/**', 'assets/**', 'classic/**', 'models/**', 'textures/**', 'skins/**', 'emotes/**',
                'defaults.json', 'hotload.json', 'manifest.json', 'build.json'
    }
    into layout.buildDirectory.dir('generated/clientAssets/client')
}

// the eula (legal + human tl;dr, en/es) ships inside the apk for the native gate
android.sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir('generated/eulaAssets')]

tasks.register('syncEulaAssets', Copy) {
    description 'copies the eula files into the apk assets'
    from(rootDir.parentFile) {
        include 'EULA.md', 'EULA.es.md', 'EULA-TLDR.md', 'EULA-TLDR.en.md'
    }
    into layout.buildDirectory.dir('generated/eulaAssets/eula')
}

tasks.named('preBuild') { dependsOn 'syncClientAssets', 'syncEulaAssets' }
